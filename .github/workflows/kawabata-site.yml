# かわばた日和の公開ページ（/kawabata/）を作り直す。
# 管理ページ（/kawabata-admin/）で記事・お店・イベントを保存すると kawabata-data/ が更新され、これが動く。
# 予約公開の記事を時間どおりに出すため、1時間ごとにも動く（変更がなければ何もしない）。
name: かわばた日和を書き出す

on:
  push:
    branches: [main]
    paths:
      - "kawabata-data/**"
      - "kawabata-biyori/**"
      - ".github/workflows/kawabata-site.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kawabata-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kawabata-biyori/package-lock.json

      - name: 依存パッケージを入れる
        working-directory: kawabata-biyori
        run: npm ci

      - name: 公開ページを書き出す
        working-directory: kawabata-biyori
        env:
          NEXT_PUBLIC_SITE_URL: https://sereness25-cyber.github.io/sereness.main1/kawabata
          NEXT_TELEMETRY_DISABLED: "1"
        run: ./scripts/export-static.sh ../kawabata

      - name: 変更があれば保存する
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kawabata
          if git diff --cached --quiet; then
            echo "公開ページに変更はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "かわばた日和の公開ページを更新"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages を更新する
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages の更新依頼に失敗しました（push による自動更新を待ちます）"
