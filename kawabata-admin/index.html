<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>かわばた日和 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 配色はかわばた日和の仕様（アイボリー・ダスティピンク・ネイビー）に合わせる */
:root {
  --bg: #f4f1ec; --card: #ffffff; --ink: #333333; --muted: #777777; --line: #e6ded3;
  --navy: #34445c; --navy-deep: #263347; --rose: #d9a7ad; --blush: #c9768a;
  --ok-bg: #e8f3ec; --ok: #1f6b3a; --warn-bg: #fdf1d8; --warn: #8a5a00; --err-bg: #fbecee; --err: #8a1c30;
  --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.75 var(--sans); }
a { color: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
[hidden] { display: none !important; }

.head { position: sticky; top: 0; z-index: 20; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px max(16px, env(safe-area-inset-left)); background: var(--navy); color: #fff; }
.brand { font-family: var(--mincho); font-size: 1.15rem; letter-spacing: .06em; }
.brand small { display: block; font-family: var(--sans); font-size: .62rem; letter-spacing: .3em; opacity: .7; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.top a, .top button { color: #fff; }

.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-left)); background: var(--navy-deep); scroll-padding-inline: 16px; }
.tabs::after { content: ""; flex: 0 0 8px; }
.tabs button { flex: none; padding: 8px 14px; border: 0; border-radius: 999px; background: transparent; color: #fff; opacity: .8; cursor: pointer; }
.tabs button[aria-selected="true"] { background: rgba(255,255,255,.18); opacity: 1; font-weight: 700; }

main { max-width: 1120px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 80px; }
h1 { font-family: var(--mincho); font-size: 1.35rem; color: var(--navy); margin: 0 0 4px; letter-spacing: .04em; }
h2 { font-size: 1rem; color: var(--navy); margin: 0 0 10px; }
.lead { color: var(--muted); font-size: .88rem; margin: 0 0 16px; }
.panel { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: 0 6px 20px -12px rgba(52,68,92,.35); }
.stack > * + * { margin-top: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.layout { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 320px; } .side { position: sticky; top: calc(var(--head-h, 104px) + 12px); align-self: start; } }

label.f { display: block; }
label.f > span, .flabel { display: block; margin-bottom: 4px; font-size: .85rem; font-weight: 700; color: var(--navy); }
.hint { display: block; margin-top: 3px; font-size: .75rem; color: var(--muted); }
input[type=text], input[type=url], input[type=password], input[type=date], input[type=datetime-local], input[type=search], input[type=number], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid #d9cfc2; border-radius: 10px; background: #fff;
}
textarea { resize: vertical; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; }
.check input { margin-top: 5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #d9cfc2; background: #fff; color: var(--navy); font-weight: 700; font-size: .88rem; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.rose { background: var(--blush); border-color: var(--blush); color: #fff; }
.btn.danger { background: #b3263e; border-color: #b3263e; color: #fff; }
.btn.small { min-height: 32px; padding: 0 12px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.note { padding: 10px 14px; border-radius: 10px; font-size: .86rem; }
.note.ok { background: var(--ok-bg); color: var(--ok); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.err { background: var(--err-bg); color: var(--err); }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
.pill.draft { background: #eee; color: #555; }
.pill.published { background: var(--ok-bg); color: var(--ok); }
.pill.scheduled { background: var(--warn-bg); color: var(--warn); }
.pill.private { background: var(--err-bg); color: var(--err); }

table.list { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table-wrap { overflow-x: auto; background: var(--card); border-radius: 14px; box-shadow: 0 6px 20px -12px rgba(52,68,92,.35); }
table.list th { text-align: left; font-size: .75rem; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 10px 12px; border-bottom: 1px solid #f1ebe3; vertical-align: top; }
table.list tr:hover td { background: #fbf9f6; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--navy); font-weight: 700; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.sub { display: block; font-size: .75rem; color: var(--muted); }

/* エディター */
.toolbar { position: sticky; top: var(--head-h, 104px); z-index: 5; display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); background: #fff; border-radius: 14px 14px 0 0; }
.toolbar button, .toolbar select { min-height: 34px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--navy); cursor: pointer; font-size: .85rem; }
.toolbar button:hover { background: #f4f1ec; }
.toolbar select { border: 1px solid var(--line); max-width: 9.5rem; }
.toolbar .sep { width: 1px; margin: 4px 4px; background: var(--line); }
.editor-box { background: #fff; border-radius: 14px; box-shadow: 0 6px 20px -12px rgba(52,68,92,.35); }
.editor { min-height: 380px; padding: 16px 18px; outline: none; line-height: 2; font-size: 1rem; }
.editor:empty::before { content: "本文を書きましょう…"; color: #aaa; }
.editor h2 { font-family: var(--mincho); font-size: 1.3rem; border-top: 3px double var(--navy); padding-top: .6em; margin: 1.6em 0 .6em; }
.editor h3 { font-family: var(--mincho); font-size: 1.1rem; margin: 1.4em 0 .5em; }
.editor h4 { font-size: 1rem; margin: 1.2em 0 .4em; }
.editor blockquote { margin: 1.2em 0; padding: .8em 0; border-top: 1px solid var(--navy); border-bottom: 1px solid var(--navy); text-align: center; font-family: var(--mincho); color: var(--navy); }
.editor .callout { margin: 1.2em 0; padding: .8em 1em; border-left: 3px solid var(--rose); background: #fbf3f3; }
.editor img { max-width: 100%; height: auto; border-radius: 8px; }
.editor figure { margin: 1.2em 0; }
.editor figcaption { font-size: .85rem; color: var(--muted); text-align: center; }
.gallery { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gallery li { list-style: none; background: #fbf9f6; border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; display: block; }
.gallery input { margin-top: 6px; padding: 6px 8px; font-size: .82rem; }
.gallery .row { margin-top: 6px; gap: 4px; }
.photo-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 96px; border: 2px dashed #d9cfc2; border-radius: 12px; background: #fff; color: var(--navy); font-weight: 700; cursor: pointer; width: 100%; }
.photo-drop small { font-weight: 400; color: var(--muted); }
.editor table { border-collapse: collapse; width: 100%; }
.editor th, .editor td { border: 1px solid var(--line); padding: 6px 8px; }
.editor [data-shop-card], .editor [data-article-card] { margin: 1em 0; padding: .6em 1em; border: 1px dashed var(--rose); border-radius: 10px; color: var(--navy); font-size: .9rem; background: #fff; }
.source { width: 100%; min-height: 380px; border: 0; border-radius: 0 0 14px 14px; padding: 16px; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }

.status-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px max(16px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); background: var(--navy); color: #fff; font-size: .85rem; }
.status-bar.err { background: #8a1c30; }
.status-bar.ok { background: #1f6b3a; }

.login { max-width: 520px; margin: 40px auto; }
.steps { margin: 0; padding-left: 1.3em; font-size: .88rem; }
.steps li + li { margin-top: 6px; }
.thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: #eee; }
.stat { display: block; padding: 14px; border-radius: 12px; background: var(--card); box-shadow: 0 6px 20px -12px rgba(52,68,92,.35); text-decoration: none; color: inherit; }
.stat b { display: block; font-size: 1.8rem; color: var(--navy); line-height: 1.2; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>

<!-- ふだんは出ない。Apps Script に KAWABATA_PASSWORD を設定したときだけ表示される -->
<section id="unlock" class="login" hidden>
  <div class="panel stack">
    <p class="brand" style="color:var(--navy)">かわばた日和<small style="color:var(--blush)">ADMIN</small></p>
    <label class="f"><span>パスワード</span><input id="pw" type="password" autocomplete="current-password"></label>
    <label class="check"><input type="checkbox" id="stay"><span>この端末ではログインしたままにする（共用のパソコンでは使わないでください）</span></label>
    <div id="unlock-msg"></div>
    <button class="btn primary" id="unlock-btn" type="button">ログイン</button>
  </div>
</section>

<!-- 管理画面 -->
<div id="app" hidden>
  <div class="head" id="head">
  <header class="top">
    <span class="brand">かわばた日和<small>ADMIN</small></span>
    <span class="top-actions">
      <a class="btn small" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)" href="../kawabata/" target="_blank" rel="noopener">サイトを見る ↗</a>
    </span>
  </header>
  <nav class="tabs" role="tablist" aria-label="管理メニュー">
    <button role="tab" data-view="home">ダッシュボード</button>
    <button role="tab" data-view="articles">記事</button>
    <button role="tab" data-view="shops">お店</button>
    <button role="tab" data-view="events">イベント</button>
    <button role="tab" data-view="photos">写真</button>
    <button role="tab" data-view="settings">設定</button>
  </nav>
  </div>
  <main id="view"></main>
</div>

<div id="status" class="status-bar" role="status" hidden></div>

<script src="../kawabata/js/kawabata-hours.js"></script>
<script src="hours-editor.js"></script>
<script>
"use strict";
/* ============================================================
   設定
   ============================================================ */
/* 保存先は Google Apps Script（apps-script/Code.gs）。ログインなしで開ける */
const API = "https://script.google.com/macros/s/AKfycbwOwYiigmue3tHoj_PnGPtxaWktpb4mGLaULf9qzeyGix7q_voD_mq0vqL2iq-URQym/exec";
const SITE = "https://sereness25-cyber.github.io/sereness.main1/kawabata";
const SHOP_FEATURES = [["karaoke", "カラオケあり"], ["darts", "ダーツあり"], ["card", "カード払い可"], ["smoke_free", "禁煙"]];
const SERENESS = "cafe-bar-sereness";
const SHOP_CATS = [["izakaya","居酒屋"],["bar","BAR"],["snack","スナック"],["dining","ダイニング"],["karaoke","カラオケ"],["other","その他"]];
const BUDGETS = [["","未設定"],["1","〜3,000円"],["2","3,000〜5,000円"],["3","5,000〜8,000円"],["4","8,000円〜"]];
const STATUS = { draft: "下書き", published: "公開", scheduled: "予約公開", private: "非公開" };

/* ============================================================
   小さな道具
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = {
  get(k) { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  set(k, v, persist) { try { (persist ? localStorage : sessionStorage).setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} },
};
function status(text, kind = "", ms = 0) {
  const el = $("#status");
  el.textContent = text; el.className = "status-bar " + kind; el.hidden = false;
  clearTimeout(status.t);
  if (ms) status.t = setTimeout(() => (el.hidden = true), ms);
}
const nowIso = () => new Date().toISOString();
const toLocal = (iso) => (iso ? new Date(new Date(iso).getTime() + 9 * 3600e3).toISOString().slice(0, 16) : "");
const fromLocal = (v) => (v ? new Date(v + ":00+09:00").toISOString() : null);
const fmt = (iso) => (iso ? new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date(iso)) : "—");
function slugify(s) {
  const a = String(s).normalize("NFKC").toLowerCase().replace(/[^a-z0-9\s-]/g, "").trim().replace(/\s+/g, "-").replace(/-+/g, "-");
  return a || "post-" + Date.now().toString(36);
}
/* タグ名から安定したスラッグを作る（サイト側と同じ計算） */
function tagSlug(name) {
  const a = slugify(name);
  if (!a.startsWith("post-")) return a;
  let h = 2166136261;
  for (const ch of name.normalize("NFKC")) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
  return "t-" + (h >>> 0).toString(36);
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ============================================================
   保存先（Apps Script）とのやりとり
   ============================================================ */
let PASS = "";
async function api(action, payload = {}) {
  let text = "";
  try {
    const res = await fetch(API, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, passcode: PASS, ...payload }) });
    text = await res.text();
  } catch { throw new Error("通信できませんでした。電波の状態を確認して、もう一度お試しください。"); }
  let j = null;
  try { j = JSON.parse(text); } catch {}
  if (!j) throw new Error(/accounts\.google|<html|<!doctype/i.test(text) ? "Apps Script のデプロイ設定（アクセスできるユーザー：全員）を確認してください。" : "想定外の返事が返ってきました。");
  if (!j.kb) throw new Error("Apps Script が古いままです。apps-script/Code.gs を貼り直して「新バージョン」でデプロイしてください。");
  if (!j.ok) { const e = new Error(j.error || "うまくいきませんでした。"); e.auth = !!j.auth; throw e; }
  return j;
}

/* 1件だけ書き換えて保存する（サーバー側で最新を読み直してから書くので、別の端末の変更を消さない） */
async function saveItem(file, key, item, _message, { remove = false } = {}) {
  const j = await api("kb_save", { file: key, item, remove });
  cache[key] = j.list;
}

/* 画像を最大2000pxのWebPにしてアップロードし、公開URLを返す */
async function uploadImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("JPEG・PNG・WebP の画像を選んでください。");
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/webp", 0.85));
  const mime = blob && blob.type === "image/webp" ? "image/webp" : "image/jpeg";
  const out = mime === "image/webp" ? blob : await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(out); });
  const j = await api("kb_upload", { data, mime });
  return { url: j.url, preview: URL.createObjectURL(out) };
}

/* ============================================================
   データ
   ============================================================ */
const cache = { articles: null, shops: null, events: null, categories: null, settings: null };
async function loadAll() {
  if (!cache.articles) Object.assign(cache, (await api("kb_load")).data);
  return cache;
}
const load = async (key) => (await loadAll())[key];
const loadArticles = () => load("articles");
const loadShops = () => load("shops");
const loadEvents = () => load("events");
const loadCategories = () => load("categories");

/* ============================================================
   パスワード（Apps Script に KAWABATA_PASSWORD を設定したときだけ使う）
   ============================================================ */
$("#unlock-btn").addEventListener("click", async () => {
  const msg = $("#unlock-msg"), pw = $("#pw").value;
  if (!pw) return (msg.innerHTML = '<p class="note err">パスワードを入力してください。</p>');
  $("#unlock-btn").disabled = true; msg.innerHTML = '<p class="note">確認しています…</p>';
  PASS = pw;
  try {
    await api("kb_login");
    store.set("kb-pass", pw, $("#stay").checked);
    start();
  } catch (e) { PASS = ""; msg.innerHTML = `<p class="note err">${esc(e.message)}</p>`; }
  finally { $("#unlock-btn").disabled = false; }
});
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#unlock-btn").click(); });

/* ============================================================
   画面の切り替え
   ============================================================ */
const views = {};
let dirty = false;
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
function go(name, arg) {
  if (dirty && !confirm("保存していない変更があります。移動しますか？")) return;
  dirty = false;
  $$(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === name.split(":")[0])));
  const view = $("#view");
  view.innerHTML = '<p class="lead">読み込んでいます…</p>';
  views[name](view, arg).catch((e) => {
    if (e.auth) { store.del("kb-pass"); PASS = ""; $("#app").hidden = true; $("#unlock").hidden = false; $("#unlock-msg").innerHTML = `<p class="note err">${esc(e.message)}</p>`; return; }
    view.innerHTML = `<p class="note err">読み込めませんでした：${esc(e.message)}</p>`;
  });
  window.scrollTo(0, 0);
}
$$(".tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.view)));

/* ============================================================
   ダッシュボード
   ============================================================ */
views.home = async (el) => {
  const [articles, shops, events] = await Promise.all([loadArticles(), loadShops(), loadEvents()]);
  const now = Date.now();
  const live = articles.filter((a) => (a.status === "published" || a.status === "scheduled") && a.published_at && new Date(a.published_at) <= now);
  const sched = articles.filter((a) => a.status === "scheduled" && a.published_at && new Date(a.published_at) > now);
  el.innerHTML = `
    <h1>ダッシュボード</h1>
    <p class="lead">保存すると、10〜15分ほどで <a href="${SITE}/" target="_blank" rel="noopener">公開ページ</a> に反映されます（下書き・非公開は公開されません）。</p>
    <div class="stats">
      <a class="stat" href="#" data-go="articles"><span class="sub">公開中の記事</span><b>${live.length}</b></a>
      <a class="stat" href="#" data-go="articles"><span class="sub">下書き</span><b>${articles.filter((a) => a.status === "draft").length}</b></a>
      <a class="stat" href="#" data-go="articles"><span class="sub">予約</span><b>${sched.length}</b></a>
      <a class="stat" href="#" data-go="shops"><span class="sub">掲載中のお店</span><b>${shops.filter((s) => s.is_published).length}</b></a>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" data-new="article" type="button">新しい記事を書く</button>
      <button class="btn" data-new="shop" type="button">お店を追加</button>
      <button class="btn" data-new="event" type="button">イベントを追加</button>
    </div>
    <section class="panel" style="margin-top:18px">
      <h2>最近更新した記事</h2>
      <ul style="margin:0;padding-left:1.2em">${[...articles].sort((a, b) => b.updated_at.localeCompare(a.updated_at)).slice(0, 6).map((a) => `<li><button class="linkbtn" data-edit="${esc(a.id)}">${esc(a.title || "（無題）")}</button> <span class="pill ${a.status}">${STATUS[a.status]}</span></li>`).join("")}</ul>
    </section>`;
  bindCommon(el);
};

function bindCommon(el) {
  $$("[data-go]", el).forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); go(a.dataset.go); }));

  $$("[data-edit]", el).forEach((b) => b.addEventListener("click", () => go("articles:edit", b.dataset.edit)));
}

  const body = $("#a-body"), source = $("#a-source");

  $$("input, textarea, select", el).forEach((x) => x.addEventListener("input", mark));
  body.addEventListener("input", mark);

  const counts = () => {
    $("#a-seot-n").textContent = `${[...$("#a-seot").value].length}文字（目安：20〜40文字。空欄なら記事タイトル）`;

  };
  counts(); $("#a-seot").addEventListener("input", counts); $("#a-seod").addEventListener("input", counts);
  const dateUi = () => {

    $("#a-date-hint").textContent = s === "scheduled" ? "この時刻を過ぎると自動で公開されます（1時間ごとに確認）" : "空欄なら保存した時刻になります";
  };
  dateUi(); $("#a-status").addEventListener("change", dateUi);

  /* 一時保存（この端末だけ） */
  try {
    const bk = JSON.parse(localStorage.getItem(backupKey) || "null");
    if (bk && bk.html !== a.content) {
      $("#restore").innerHTML = `<p class="note warn">この端末に、${fmt(new Date(bk.at).toISOString())} に一時保存した編集内容があります。 <button class="btn small" type="button" id="do-restore">復元する</button> <button class="btn small" type="button" id="drop-restore">破棄</button></p>`;
      $("#do-restore").onclick = () => { body.innerHTML = bk.html; $("#a-title").value = bk.title; $("#a-excerpt").value = bk.excerpt; $("#restore").innerHTML = ""; mark(); };
      $("#drop-restore").onclick = () => { localStorage.removeItem(backupKey); $("#restore").innerHTML = ""; };
    }
  } catch {}
  const autosave = setInterval(() => {
    if (!document.body.contains(body)) return clearInterval(autosave);
    if (!dirty) return;
    try { localStorage.setItem(backupKey, JSON.stringify({ at: Date.now(), html: html(), title: $("#a-title").value, excerpt: $("#a-excerpt").value })); $("#a-dirty").textContent = "この端末に一時保存しました"; } catch {}
  }, 10000);

  /* ツールバー。ボタンやメニューを押すと本文の入力位置が外れるので、最後の位置を覚えて戻す */
  let caret = null;
  const remember = () => { const s = window.getSelection(); if (s.rangeCount && body.contains(s.anchorNode)) caret = s.getRangeAt(0).cloneRange(); };
  ["keyup", "mouseup", "input", "focus"].forEach((ev) => body.addEventListener(ev, remember));
  document.addEventListener("selectionchange", () => { if (document.activeElement === body) remember(); });
  const restore = () => {
    body.focus();
    const s = window.getSelection();
    if (s.rangeCount && body.contains(s.anchorNode)) return;
    s.removeAllRanges();
    if (caret) s.addRange(caret);
    else { const r = document.createRange(); r.selectNodeContents(body); r.collapse(false); s.addRange(r); }
  };
  const exec = (c, v) => { restore(); document.execCommand(c, false, v); remember(); mark(); };
  const insertHtml = (h) => exec("insertHTML", h);
  /* 箱型の要素（カード・表・注意書き）は、いまいる段落の直後に差し込む */
  const insertBlock = (h) => {
    restore();
    const s = window.getSelection();
    let node = s.rangeCount ? s.getRangeAt(0).startContainer : null;
    while (node && node.parentNode !== body) node = node.parentNode;
    const tpl = document.createElement("template");
    tpl.innerHTML = h + "<p><br></p>";
    const last = tpl.content.lastChild;
    if (node) body.insertBefore(tpl.content, node.nextSibling); else body.appendChild(tpl.content);
    const r = document.createRange(); r.setStart(last, 0); r.collapse(true); s.removeAllRanges(); s.addRange(r);
    remember(); mark();
  };
  $$("[data-cmd]", el).forEach((b) => b.addEventListener("click", () => {
    const c = b.dataset.cmd;
    if (c === "source") {
      sourceMode = !sourceMode;
      if (sourceMode) { source.value = body.innerHTML; } else { body.innerHTML = source.value; }
      body.hidden = sourceMode; source.hidden = !sourceMode; b.textContent = sourceMode ? "見たまま" : "HTML"; return;
    }
    if (sourceMode) return;
    if (["h2", "h3", "h4", "p"].includes(c)) return exec("formatBlock", c);
    if (c === "bold" || c === "italic" || c === "undo" || c === "redo") return exec(c);
    if (c === "ul") return exec("insertUnorderedList");
    if (c === "ol") return exec("insertOrderedList");
    if (c === "quote") return exec("formatBlock", "blockquote");
    if (c === "callout") { const t = String(window.getSelection() || "") || "注意書きの文章"; return insertBlock(`<div class="callout" data-callout=""><p>${esc(t)}</p></div>`); }
    if (c === "link") { const u = prompt("リンク先のURL（サイト内の記事は /articles/スラッグ）", "https://"); if (u) exec("createLink", u); return; }
    if (c === "table") return insertBlock("<table><thead><tr><th>見出し</th><th>見出し</th></tr></thead><tbody><tr><td>　</td><td>　</td></tr><tr><td>　</td><td>　</td></tr></tbody></table>");
    if (c === "image") return $("#img-file").click();
  }));
  $("#a-photo-btn").addEventListener("click", () => { if (!sourceMode) $("#img-file").click(); });
  $("#img-file").addEventListener("change", async (e) => {
    const files = [...e.target.files]; e.target.value = ""; if (!files.length) return;
    let done = 0;
    for (const f of files) {
      const cap = (prompt(`写真の説明（写真の下に表示されます。空欄でもOK）\n${f.name}`, "") || "").trim();
      try {
        status(`写真をアップロードしています…（${done + 1}/${files.length}）`);
        const up = await uploadImage(f);
        insertBlock(`<figure><img src="${esc(up.url)}" alt="${esc(cap)}">${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}</figure>`);
        done++;
      } catch (err) { status(`「${f.name}」を追加できませんでした：` + err.message, "err", 6000); return; }
    }
    status(`写真を${done}枚入れました。記事を保存すると反映されます。`, "ok", 5000);
  });
  $$("[data-embed]", el).forEach((s) => s.addEventListener("change", () => {
    if (!s.value || sourceMode) return;
    const kind = s.dataset.embed, label = s.options[s.selectedIndex].text;
    insertBlock(`<div data-${kind}-card="" data-slug="${esc(s.value)}" contenteditable="false">${kind === "shop" ? "店舗紹介カード" : "関連記事カード"}：${esc(label)}</div>`);
    s.value = "";
  }));

  /* アイキャッチ */
  $("#a-thumb-btn").onclick = () => $("#thumb-file").click();
  $("#a-thumb-del").onclick = () => { a.thumbnail = null; $("#a-thumb").hidden = true; $("#a-thumb-del").hidden = true; mark(); };
  $("#thumb-file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { status("画像をアップロードしています…"); const up = await uploadImage(f); a.thumbnail = up.url; const img = $("#a-thumb"); img.src = up.preview; img.hidden = false; $("#a-thumb-del").hidden = false; mark(); status("アイキャッチ画像を設定しました。保存すると反映されます。", "ok", 4000); }
    catch (err) { status("画像を追加できませんでした：" + err.message, "err", 6000); }
  });

  /* 保存 */
  $("#a-save").onclick = async () => {
    const msg = $("#a-msg"); msg.innerHTML = "";
    const st = $("#a-status").value;
    let pub = fromLocal($("#a-date").value);
    const title = $("#a-title").value.trim();
    const slug = slugify($("#a-slug").value || title);
    const err = (t) => (msg.innerHTML = `<p class="note err">${esc(t)}</p>`);
    if ((st === "published" || st === "scheduled") && !title) return err("公開するにはタイトルが必要です。");
    if (st === "scheduled" && (!pub || new Date(pub) <= new Date())) return err("予約公開の日時は、現在より後にしてください。");
    if (st === "published" && !pub) pub = nowIso();
    if (articles.some((x) => x.id !== a.id && x.slug === slug)) return err(`URLスラッグ「${slug}」は別の記事で使われています。`);
    const names = [...new Set($("#a-tags").value.split(/[、,，\s]+/).map((t) => t.trim()).filter(Boolean))];
    const item = {
      ...a, title, slug, content: html(), excerpt: $("#a-excerpt").value.trim(), status: st, published_at: pub,
      thumbnail_alt: $("#a-thumb-alt").value.trim(), thumbnail_is_ai: $("#a-thumb-ai").checked,
      seo_title: $("#a-seot").value.trim(), seo_description: $("#a-seod").value.trim(), focus_keyword: $("#a-kw").value.trim(),
      is_featured: $("#a-featured").checked, is_sponsored: $("#a-sponsored").checked,
      category_slugs: $$('input[name="cat"]:checked', el).map((x) => x.value),
      shop_slugs: $$('input[name="shop"]:checked', el).map((x) => x.value),
      tags: names.map((n) => { const s = tagSlug(n); return { id: "tag-" + s, slug: s, name: n }; }),
      updated_at: nowIso(),
    };
    $("#a-save").disabled = true; status("保存しています…");
    try {
      await saveItem("articles.json", "articles", item, `記事を保存: ${item.title || item.slug}（${STATUS[st]}）`);
      dirty = false; try { localStorage.removeItem(backupKey); } catch {}
      status(st === "draft" || st === "private" ? "保存しました（サイトには表示されません）。" : "保存しました。10〜15分ほどで公開ページに反映されます。", "ok", 5000);
      go("articles:edit", item.id);
    } catch (e2) { status("保存できませんでした：" + e2.message, "err", 8000); $("#a-save").disabled = false; }
  };
  if ($("#a-del")) $("#a-del").onclick = async () => {
    if (!confirm("この記事を削除します。元に戻せません。よろしいですか？")) return;
    try { status("削除しています…"); await saveItem("articles.json", "articles", a, `記事を削除: ${a.title}`, { remove: true }); dirty = false; status("削除しました。", "ok", 4000); go("articles"); }
    catch (e) { status("削除できませんでした：" + e.message, "err", 8000); }
  };
  $("#back").onclick = () => go("articles");
};

  el.innerHTML = `
    <div class="row between"><h1>${src ? "お店の編集" : "お店を追加"}</h1><button class="btn" type="button" id="back">← お店一覧</button></div>
    <div class="layout" style="margin-top:12px">
      <div class="stack" style="min-width:0">

            ${t("s-slug", "URLスラッグ", s.slug, "半角英小文字・数字・ハイフン")}${t("s-address", "住所", s.address)}</div>

        <section class="panel stack"><h2>写真</h2>
          <div class="grid2">
            <div>
              <span class="flabel">メイン写真（一覧やお店ページの一番上に出ます）</span>
              <img class="thumb" id="s-img" alt="" ${s.image ? `src="${esc(s.image)}"` : "hidden"}>
              <div class="row" style="margin-top:6px"><button class="btn small" type="button" id="s-img-btn">${s.image ? "変更" : "📷 写真を選ぶ"}</button><button class="btn small" type="button" id="s-img-del" ${s.image ? "" : "hidden"}>外す</button></div>
              <input type="text" id="s-img-alt" placeholder="写真の説明（例：カウンター席）" value="${esc(s.image_alt)}" style="margin-top:6px">
            </div>
            <div>
              <span class="flabel">お店から写真使用の許可</span>
              <label class="check"><input type="checkbox" id="s-perm" ${s.photo_permission ? "checked" : ""}><span>お店から写真を使う許可を得た（写真を載せるときは必須）</span></label>
            </div>
          </div>
          <div>
            <span class="flabel">ほかの写真（最大12枚・お店のページに並びます）</span>
            <ul class="gallery" id="s-gallery" style="margin:0;padding:0"></ul>
            <button class="photo-drop" type="button" id="s-gal-btn" style="margin-top:8px">＋ 写真を追加<small>まとめて選べます</small></button>
          </div>
          <input type="file" id="s-file" accept="image/jpeg,image/png,image/webp" hidden>
          <input type="file" id="s-gal-file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        </section>
        <section class="panel stack"><h2>営業・料金</h2>
          <div class="grid2">${t("s-hours", "営業時間", s.business_hours)}${t("s-closed", "定休日", s.closed_days)}${t("s-price", "料金", s.price_range, "例：チャージ500円＋ドリンク、セット3,000円/90分")}
            <label class="f"><span>予算の目安（検索用）</span><select id="s-budget">${BUDGETS.map(([v, l]) => `<option value="${v}" ${String(s.budget_level ?? "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            ${t("s-pay", "支払方法", s.payment_methods)}${t("s-seats", "席数", s.seats)}
            <label class="f"><span>一人での利用</span>${triSel("s-solo", s.solo_ok, "OK", "グループ向け")}</label>
            <label class="f"><span>ノンアル対応</span>${triSel("s-nonalc", s.non_alcohol, "あり", "なし")}</label></div>
        </section>
        <section class="panel stack"><h2>営業時間（本日営業のお店）</h2>
          ${s.slug === SERENESS
            ? '<p class="note">Serenessの営業時間は、お店の<a href="../schedule-admin.html" target="_blank" rel="noopener">営業スケジュール管理ページ</a>の内容が自動で使われます（臨時休業もそちらで）。</p>'
            : '<div id="s-hours-ed"></div>'}
          <div id="s-preview"></div>
          ${s.slug === SERENESS ? "" : '<div><span class="flabel">臨時休業・臨時営業・時間変更</span><div id="s-specials"></div></div>'}
          <div><span class="flabel">設備・サービス（一覧ページの絞り込みに使います）</span>
            <div class="row">${SHOP_FEATURES.map(([v, l]) => `<label class="check" style="margin:0 10px 0 0"><input type="checkbox" class="s-feat" value="${v}" ${(s.features || []).includes(v) ? "checked" : ""}><span>${l}</span></label>`).join("")}</div></div>
          <label class="f"><span>地図の位置（緯度, 経度）</span><input type="text" id="s-latlng" value="${s.lat != null && s.lng != null ? esc(s.lat + ", " + s.lng) : ""}" placeholder="例：39.7195, 140.1155">
            <span class="hint">Googleマップでお店の場所を長押し（パソコンは右クリック）すると出る数字を貼り付けます。一覧ページの地図に表示されます。</span></label>
        </section>
        <section class="panel stack"><h2>リンク・出典</h2>
          <div class="grid2">${t("s-web", "公式サイト", s.website || "")}${t("s-ig", "Instagram", (s.sns || {}).instagram || "")}${t("s-x", "X", (s.sns || {}).x || "")}${t("s-fb", "Facebook", (s.sns || {}).facebook || "")}</div>
          <label class="f"><span>情報の出典</span><textarea id="s-sources" rows="3" placeholder="公式サイト | https://example.com">${esc((s.sources || []).map((x) => `${x.label} | ${x.url}`).join("\n"))}</textarea><span class="hint">1行に1つ、「表示名 | URL」の形で入力</span></label>
        </section>
      </div>
      <aside class="side stack">
        <div class="panel stack">
          <label class="f"><span>情報の確認日</span><input type="date" id="s-verified" value="${esc(s.verified_at || "")}"><span class="hint">公開には必須です</span></label>
          <label class="check"><input type="checkbox" id="s-confirmed" ${s.shop_confirmed ? "checked" : ""}><span>掲載内容をお店に確認済み（外すと「公開情報をもとに掲載」と表示）</span></label>
          <label class="check"><input type="checkbox" id="s-pub" ${s.is_published ? "checked" : ""}><span>サイトに公開する</span></label>
          <div id="s-msg"></div>
          <button class="btn primary" type="button" id="s-save">保存</button>
        </div>
        <div class="panel stack"><h2 style="margin:0">初心者歓迎マーク</h2>
          <p class="hint" style="margin:0">次の4点をすべて、お店に確認できた場合だけ付けてください。</p>
          ${["料金が明確", "初来店客を歓迎", "料金説明に対応", "不明瞭な追加料金がない"].map((x, i) => `<label class="check"><input type="checkbox" class="bw" ${s.beginner_welcome ? "checked" : ""}><span>${x}</span></label>`).join("")}
          <label class="check" style="border-top:1px solid var(--line);padding-top:8px"><input type="checkbox" id="s-bw" ${s.beginner_welcome ? "checked" : ""}><b>初心者歓迎マークを表示</b></label>
        </div>
        <div class="panel stack"><h2 style="margin:0">お店用の管理ページ</h2>
          <p class="hint" style="margin:0">お店の人が、自分のお店の営業時間・臨時休業だけを変えられるページです。合言葉を発行して、URLと一緒にお店に伝えてください。</p>
          ${!src ? '<p class="hint" style="margin:0">お店を保存すると発行できます。</p>'
            : s.slug === SERENESS ? '<p class="hint" style="margin:0">Serenessは営業スケジュール管理ページを使います。</p>'
            : `<p style="margin:0">${(cache.shop_keys || []).includes(s.slug) ? '<span class="pill published">発行済み</span>' : '<span class="pill draft">未発行</span>'}</p>
               <div id="s-key-box"></div>
               <button class="btn small" type="button" id="s-key">${(cache.shop_keys || []).includes(s.slug) ? "合言葉を発行し直す" : "合言葉を発行する"}</button>`}
        </div>
        ${src ? '<button class="btn danger" type="button" id="s-del">お店を削除</button>' : ""}
      </aside>
    </div>`;
  $$("input, textarea, select", el).forEach((x) => x.addEventListener("input", () => (dirty = true)));
  $("#back").onclick = () => go("shops");
  $("#s-img-btn").onclick = () => $("#s-file").click();
  $("#s-img-del").onclick = () => { s.image = null; $("#s-img").hidden = true; $("#s-img-del").hidden = true; dirty = true; };
  $("#s-file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { status("写真をアップロードしています…"); const up = await uploadImage(f); s.image = up.url; $("#s-img").src = up.preview; $("#s-img").hidden = false; $("#s-img-del").hidden = false; dirty = true; status("写真を設定しました。保存すると反映されます。", "ok", 4000); }
    catch (err) { status("写真を追加できませんでした：" + err.message, "err", 6000); }
  });
  /* ほかの写真 */
  s.gallery = Array.isArray(s.gallery) ? s.gallery : [];
  const previews = new Map();
  const drawGallery = () => {
    $("#s-gallery").innerHTML = s.gallery.map((g, i) => `<li>
      <img src="${esc(previews.get(g.url) || g.url)}" alt="">
      <input type="text" data-cap="${i}" value="${esc(g.caption)}" placeholder="説明（空欄でもOK）">
      <div class="row"><button class="btn small" type="button" data-left="${i}" ${i ? "" : "disabled"} aria-label="前へ">←</button><button class="btn small" type="button" data-right="${i}" ${i < s.gallery.length - 1 ? "" : "disabled"} aria-label="後ろへ">→</button><button class="btn small" type="button" data-rm="${i}">外す</button></div>
    </li>`).join("");
    $("#s-gal-btn").hidden = s.gallery.length >= 12;
    $$("[data-cap]", el).forEach((x) => x.addEventListener("input", () => { s.gallery[+x.dataset.cap].caption = x.value.trim(); dirty = true; }));
    const swap = (a, b) => { [s.gallery[a], s.gallery[b]] = [s.gallery[b], s.gallery[a]]; dirty = true; drawGallery(); };
    $$("[data-left]", el).forEach((b) => (b.onclick = () => swap(+b.dataset.left, +b.dataset.left - 1)));
    $$("[data-right]", el).forEach((b) => (b.onclick = () => swap(+b.dataset.right, +b.dataset.right + 1)));
    $$("[data-rm]", el).forEach((b) => (b.onclick = () => { s.gallery.splice(+b.dataset.rm, 1); dirty = true; drawGallery(); }));
  };
  drawGallery();
  $("#s-gal-btn").onclick = () => $("#s-gal-file").click();
  $("#s-gal-file").addEventListener("change", async (e) => {
    const files = [...e.target.files].slice(0, 12 - s.gallery.length); e.target.value = ""; if (!files.length) return;
    let n = 0;
    for (const f of files) {
      try {
        status(`写真をアップロードしています…（${n + 1}/${files.length}）`);
        const up = await uploadImage(f);
        previews.set(up.url, up.preview);
        s.gallery.push({ url: up.url, caption: "" }); n++; dirty = true; drawGallery();
      } catch (err) { status(`「${f.name}」を追加できませんでした：` + err.message, "err", 6000); return; }
    }
    status(`写真を${n}枚追加しました。説明を書いて「保存」を押すと反映されます。`, "ok", 5000);
  });

  const v = (idn) => $("#" + idn).value.trim();
  const fromTri = (x) => (x === "" ? null : x === "yes");

  /* 営業時間・臨時変更 */
  const hoursEd = $("#s-hours-ed") ? HoursEditor.weekly($("#s-hours-ed"), s.hours, () => { dirty = true; redraw(); }) : null;
  const spEd = $("#s-specials") ? HoursEditor.specials($("#s-specials"), s.specials, () => { dirty = true; redraw(); }) : null;
  const redraw = HoursEditor.preview($("#s-preview"), () => ({ hours: hoursEd ? hoursEd.get() : s.hours, specials: spEd ? spEd.get() : s.specials || [] }));
  if ($("#s-key")) $("#s-key").onclick = async () => {
    const again = (cache.shop_keys || []).includes(s.slug);
    if (again && !confirm("発行し直すと、いまの合言葉は使えなくなります。よろしいですか？")) return;
    $("#s-key").disabled = true;
    try {
      const j = await api("kb_shop_key", { slug: s.slug });
      cache.shop_keys = [...new Set([...(cache.shop_keys || []), s.slug])];
      const url = new URL("shop.html?s=" + encodeURIComponent(s.slug), location.href).href;
      $("#s-key-box").innerHTML = `<div class="note ok" style="word-break:break-all"><b>お店に伝える内容</b><br>ページ：<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a><br>合言葉：<b style="font-size:1.1rem;letter-spacing:.08em">${esc(j.key)}</b><br><span class="hint">合言葉はこの画面でしか表示されません。忘れたときは発行し直してください。</span></div>
        <button class="btn small" type="button" id="s-key-copy" style="margin-top:6px">まとめてコピー</button>`;
      $("#s-key-copy").onclick = () => navigator.clipboard.writeText(`${s.name} の営業時間の管理ページ\n${url}\n合言葉：${j.key}`).then(() => status("コピーしました。", "ok", 3000));
      $("#s-key").textContent = "合言葉を発行し直す";
    } catch (e) { status("発行できませんでした：" + e.message, "err", 8000); }
    finally { $("#s-key").disabled = false; }
  };
  $("#s-save").onclick = async () => {
    const err = (m) => ($("#s-msg").innerHTML = `<p class="note err">${esc(m)}</p>`);
    $("#s-msg").innerHTML = "";
    const name = v("s-name");
    if (!name) return err("店名を入力してください。");
    const pub = $("#s-pub").checked, verified = v("s-verified") || null;
    if (pub && !verified) return err("公開するには情報の確認日を入力してください。");
    if ((s.image || s.gallery.length) && !$("#s-perm").checked) return err("写真を載せるときは、「お店から写真を使う許可を得た」にチェックを入れてください。");
    if ($("#s-bw").checked && !$$(".bw", el).every((x) => x.checked)) return err("初心者歓迎マークは、4項目をすべて確認してから付けてください。");
    const slug = slugify(v("s-slug") || name);
    if (shops.some((x) => x.id !== s.id && x.slug === slug)) return err(`URLスラッグ「${slug}」は別のお店で使われています。`);
    if (slug === "today") return err("「today」はURLスラッグに使えません（本日営業のお店のページと重なるため）。");
    let lat = null, lng = null;
    const ll = v("s-latlng");
    if (ll) {
      const m = /^\s*(-?\d+(?:\.\d+)?)\s*[,、 ]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(ll);
      if (!m || Math.abs(+m[1]) > 90 || Math.abs(+m[2]) > 180) return err("地図の位置は「39.7195, 140.1155」のように、緯度と経度をカンマで区切って入れてください。");
      lat = +m[1]; lng = +m[2];
    }
    let sources;
    try {
      sources = v("s-sources").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
        const [label, url] = l.includes("|") ? l.split("|").map((x) => x.trim()) : [l, l];
        new URL(url); return { label, url };
      });
    } catch { return err("出典のURLの形式を確認してください（https:// から始まるURL）。"); }
    const item = {
      ...s, name, slug, category: $("#s-cat").value, description: v("s-desc"), address: v("s-address"),
      business_hours: v("s-hours"), closed_days: v("s-closed"), price_range: v("s-price"), budget_level: v("s-budget") ? Number(v("s-budget")) : null,
      payment_methods: v("s-pay"), seats: v("s-seats"), solo_ok: fromTri($("#s-solo").value), non_alcohol: fromTri($("#s-nonalc").value),
      beginner_welcome: $("#s-bw").checked, website: v("s-web") || null,
      sns: { instagram: v("s-ig"), x: v("s-x"), facebook: v("s-fb"), youtube: (s.sns || {}).youtube || "" },
      image_alt: v("s-img-alt"), photo_permission: $("#s-perm").checked, verified_at: verified, is_published: pub,
      sources, shop_confirmed: $("#s-confirmed").checked, updated_at: nowIso(),
      hours: hoursEd ? hoursEd.get() : s.hours || null, specials: spEd ? spEd.get() : s.specials || [],
      features: $$(".s-feat", el).filter((x) => x.checked).map((x) => x.value), lat, lng,
    };
    $("#s-save").disabled = true; status("保存しています…");
    try { await saveItem("shops.json", "shops", item, `お店を保存: ${name}`); dirty = false; status("保存しました。10〜15分ほどで公開ページに反映されます。", "ok", 5000); go("shops:edit", item.id); }
    catch (e) { status("保存できませんでした：" + e.message, "err", 8000); $("#s-save").disabled = false; }
  };
  if ($("#s-del")) $("#s-del").onclick = async () => {
    if (!confirm("このお店を削除します。よろしいですか？")) return;
    try { await saveItem("shops.json", "shops", s, `お店を削除: ${s.name}`, { remove: true }); dirty = false; status("削除しました。", "ok", 4000); go("shops"); }
    catch (e) { status("削除できませんでした：" + e.message, "err", 8000); }
  };
};

views.events = async (el) => {
  const events = await loadEvents();
  const now = Date.now();
  el.innerHTML = `
    <div class="row between"><div><h1>イベント</h1><p class="lead">終了日時（なければ開始日時）を過ぎると、自動で「過去のイベント」になります。</p></div>

    ${[...events].sort((a, b) => b.starts_at.localeCompare(a.starts_at)).map((e) => `<tr><td><button class="linkbtn" data-ev="${esc(e.id)}">${esc(e.title)}</button></td><td class="sub">${fmt(e.starts_at)}</td><td>${new Date(e.ends_at || e.starts_at) < now ? '<span class="pill draft">終了</span>' : '<span class="pill published">開催予定</span>'}</td><td>${e.is_published ? "公開" : "非公開"}</td></tr>`).join("") || '<tr><td colspan="4" class="sub">まだイベントがありません。</td></tr>'}
    </tbody></table></div>`;
  bindCommon(el);
  $$("[data-ev]", el).forEach((b) => b.addEventListener("click", () => go("events:edit", b.dataset.ev)));
};

  const plain = (e.content || "").replace(/<\/p>\s*<p>/g, "\n\n").replace(/<br\s*\/?>/g, "\n").replace(/<[^>]+>/g, "");

      </section>
      <aside class="side stack">

          <label class="check"><input type="checkbox" id="e-pub" ${e.is_published ? "checked" : ""}><span>サイトに公開する</span></label>
          <div id="e-msg"></div>
          <button class="btn primary" type="button" id="e-save">保存</button>
        </div>
        <div class="panel stack"><h2 style="margin:0">画像</h2>
          <img class="thumb" id="e-img" alt="" ${e.image ? `src="${esc(e.image)}"` : "hidden"}>
          <button class="btn small" type="button" id="e-img-btn">${e.image ? "変更" : "画像を選ぶ"}</button>
          <input type="text" id="e-img-alt" placeholder="画像の説明（alt）" value="${esc(e.image_alt)}">
          <input type="file" id="e-file" accept="image/jpeg,image/png,image/webp" hidden>
        </div>
        ${src ? '<button class="btn danger" type="button" id="e-del">イベントを削除</button>' : ""}

    </div>`;
  $$("input, textarea, select", el).forEach((x) => x.addEventListener("input", () => (dirty = true)));
  $("#back").onclick = () => go("events");
  $("#e-img-btn").onclick = () => $("#e-file").click();
  $("#e-file").addEventListener("change", async (ev) => {
    const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
    try { status("画像をアップロードしています…"); const up = await uploadImage(f); e.image = up.url; $("#e-img").src = up.preview; $("#e-img").hidden = false; dirty = true; status("画像を設定しました。保存すると反映されます。", "ok", 4000); }
    catch (err) { status("画像を追加できませんでした：" + err.message, "err", 6000); }
  });
  $("#e-save").onclick = async () => {
    const err = (m) => ($("#e-msg").innerHTML = `<p class="note err">${esc(m)}</p>`);
    const title = $("#e-title").value.trim(), starts = fromLocal($("#e-start").value), ends = fromLocal($("#e-end").value);
    if (!title) return err("イベント名を入力してください。");
    if (!starts) return err("開始日時を入力してください。");
    if (ends && new Date(ends) < new Date(starts)) return err("終了日時は開始日時より後にしてください。");
    const slug = slugify($("#e-slug").value || title);
    if (events.some((x) => x.id !== e.id && x.slug === slug)) return err(`URLスラッグ「${slug}」は別のイベントで使われています。`);
    const content = $("#e-content").value.trim().split(/\n{2,}/).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
    const item = { ...e, title, slug, starts_at: starts, ends_at: ends, venue: $("#e-venue").value.trim(), fee: $("#e-fee").value.trim(), organizer: $("#e-org").value.trim(), how_to_apply: $("#e-apply").value.trim(), content, image_alt: $("#e-img-alt").value.trim(), is_published: $("#e-pub").checked, updated_at: nowIso() };
    $("#e-save").disabled = true; status("保存しています…");
    try { await saveItem("events.json", "events", item, `イベントを保存: ${title}`); dirty = false; status("保存しました。10〜15分ほどで公開ページに反映されます。", "ok", 5000); go("events:edit", item.id); }
    catch (x) { status("保存できませんでした：" + x.message, "err", 8000); $("#e-save").disabled = false; }
  };
  if ($("#e-del")) $("#e-del").onclick = async () => {
    if (!confirm("このイベントを削除します。よろしいですか？")) return;
    try { await saveItem("events.json", "events", e, `イベントを削除: ${e.title}`, { remove: true }); dirty = false; status("削除しました。", "ok", 4000); go("events"); }
    catch (x) { status("削除できませんでした：" + x.message, "err", 8000); }
  };
};

/* ============================================================
   設定（SNSリンク）
   ============================================================ */
views.settings = async (el) => {
  const data = (await load("settings")) || {};
  el.innerHTML = `
    <h1>設定</h1><p class="lead">フッターに表示するSNSのリンクです。空欄の項目は表示しません。</p>
    <section class="panel stack" style="max-width:640px">
      ${["instagram", "x", "facebook", "youtube"].map((k) => `<label class="f"><span>${{ instagram: "Instagram", x: "X", facebook: "Facebook", youtube: "YouTube" }[k]}</span><input type="url" id="st-${k}" value="${esc(data[k] || "")}" placeholder="https://"></label>`).join("")}
      <div id="st-msg"></div>
      <button class="btn primary" type="button" id="st-save">保存</button>
    </section>`;
  $("#st-save").onclick = async () => {
    const next = {};
    for (const k of ["instagram", "x", "facebook", "youtube"]) {
      const v = $("#st-" + k).value.trim();
      if (v && !/^https:\/\//.test(v)) return ($("#st-msg").innerHTML = '<p class="note err">URLは https:// から始めてください。</p>');
      next[k] = v;
    }
    try { status("保存しています…"); cache.settings = (await api("kb_settings", { settings: { ...next, photos: data.photos || {} } })).settings; status("保存しました。10〜15分ほどで公開ページに反映されます。", "ok", 5000); go("settings"); }
    catch (e) { status("保存できませんでした：" + e.message, "err", 8000); }
  };
};

/* ============================================================
   イメージ写真（写真がない記事・お店に出す仮の写真）
   ============================================================ */
const STOCK = [
  ["hero", "トップページ：メイン写真", "トップページの一番上の大きな写真", "street"],
  ["people", "トップページ：「川反の人々」の写真", "トップページの「川反の人々」コーナー", "portrait"],
  ["street", "夜の飲み屋街", "「はじめての川反」「川反の未来」の記事"],
  ["cocktail", "カクテル", "「川反の楽しみ方」の記事"],
  ["beef", "料理", "「川反グルメ」の記事／ダイニングのお店"],
  ["river", "川沿いの夜景", "「川反の歴史」「川反ニュース」の記事"],
  ["izakaya", "居酒屋のカウンター", "「川反の人々」の記事／居酒屋のお店"],
  ["bar", "BAR", "BARのお店"],
  ["snack", "スナック", "スナック・カラオケのお店"],
  ["whisky", "ウイスキー", "その他のお店"],
];
views.photos = async (el) => {
  const settings = (await load("settings")) || {};
  const photos = JSON.parse(JSON.stringify(settings.photos || {}));
  const previews = {};
  const def = (k) => `${SITE}/images/photos/${(STOCK.find((x) => x[0] === k) || [])[3] || k}.webp`;
  const card = ([k, name, where]) => `<li>
        <img src="${esc(previews[k] || (photos[k] ? photos[k].url : def(k)))}" alt="">
        <p style="margin:6px 2px 0;font-weight:700;color:var(--navy)">${name} ${photos[k] ? '<span class="pill published">差し替え中</span>' : '<span class="pill draft">最初の写真</span>'}</p>
        <p class="hint" style="margin:2px 2px 0">使われる場所：${where}</p>
        <input type="text" data-alt="${k}" value="${esc(photos[k] ? photos[k].alt : "")}" placeholder="写真の説明（例：川反通りの夜）" ${photos[k] ? "" : "hidden"}>
        <div class="row"><button class="btn small" type="button" data-pick="${k}">📷 変更</button>${photos[k] ? `<button class="btn small" type="button" data-reset="${k}">最初の写真に戻す</button>` : ""}</div>
      </li>`;
  const draw = () => {
    el.innerHTML = `
      <h1>写真</h1>
      <p class="lead">トップページの写真と、記事やお店に写真が登録されていないときに代わりに出す写真を変えられます。<br>
      記事ごと・お店ごとの写真は、それぞれの編集画面の「アイキャッチ画像」「写真」から変えられます（そちらが優先されます）。</p>
      <h2 style="margin-top:18px">トップページ</h2>
      <ul class="gallery" style="margin:0;padding:0">${STOCK.slice(0, 2).map(card).join("")}</ul>
      <h2 style="margin-top:22px">記事・お店に写真がないときの写真</h2>
      <ul class="gallery" style="margin:0;padding:0">${STOCK.slice(2).map(card).join("")}</ul>
      <input type="file" id="ph-file" accept="image/jpeg,image/png,image/webp" hidden>
      <div id="ph-msg" style="margin-top:12px"></div>
      <button class="btn primary" type="button" id="ph-save" style="margin-top:8px">保存</button>
      <p class="hint">写真は、お店や人の許可を得たもの・自分で撮ったものだけを使ってください。</p>`;
    let target = null;
    $$("[data-pick]", el).forEach((b) => (b.onclick = () => { target = b.dataset.pick; $("#ph-file").click(); }));
    $$("[data-reset]", el).forEach((b) => (b.onclick = () => { delete photos[b.dataset.reset]; delete previews[b.dataset.reset]; dirty = true; draw(); }));
    $$("[data-alt]", el).forEach((x) => x.addEventListener("input", () => { photos[x.dataset.alt].alt = x.value.trim(); dirty = true; }));
    $("#ph-file").addEventListener("change", async (e) => {
      const f = e.target.files[0]; e.target.value = ""; if (!f || !target) return;
      try {
        status("写真をアップロードしています…");
        const up = await uploadImage(f);
        photos[target] = { url: up.url, alt: (photos[target] && photos[target].alt) || "" };
        previews[target] = up.preview; dirty = true; draw();
        status("写真を差し替えました。「保存」を押すと反映されます。", "ok", 5000);
      } catch (err) { status("写真を追加できませんでした：" + err.message, "err", 6000); }
    });
    $("#ph-save").onclick = async () => {
      $("#ph-save").disabled = true;
      try {
        status("保存しています…");
        cache.settings = (await api("kb_settings", { settings: { photos } })).settings;
        dirty = false; status("保存しました。10〜15分ほどで公開ページに反映されます。", "ok", 5000); go("photos");
      } catch (e) { status("保存できませんでした：" + e.message, "err", 8000); $("#ph-save").disabled = false; }
    };
  };
  draw();
};

/* ============================================================
   起動
   ============================================================ */
function start() {
  $("#unlock").hidden = true; $("#app").hidden = false;
  const setHead = () => document.documentElement.style.setProperty("--head-h", $("#head").offsetHeight + "px");
  setHead(); window.addEventListener("resize", setHead);
  go("home");
}
store.del("kb-token"); // 以前のトークン方式の名残を消す
PASS = store.get("kb-pass") || "";
start();
</script>
